<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="xiyi-theme.css">
  <title>数据源管理 · 兮易AI大脑</title>
<style>
/* datasource-manager 特有样式 */
.header h1{font-size:20px;color:#fff;font-weight:700}
.ds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:20px}
.ds-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all .15s}
.ds-card:hover{border-color:var(--blue)}
.ds-card .name{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text)}
.ds-card .type{font-size:11px;color:var(--blue);margin-bottom:4px}
.ds-card .desc{font-size:12px;color:var(--text2);line-height:1.5}
.ds-card .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:10px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.status-online{background:var(--green)}
.status-offline{background:var(--muted)}
.status-error{background:var(--red)}
</style>
</head>
<body>
<div class="header">
  <div><h1>🔌 数据源管理</h1><div style="font-size:12px;color:var(--text2);margin-top:2px">Phase 1 · 数据治理基础</div></div>
  <div><button class="btn btn-primary btn-sm" onclick="showModal('add')">➕ 新增数据源</button><a href="/xiyi-config-console.html" class="btn" style="margin-left:6px">⚙️ 配置台</a><a href="/xiyi-quality-workbench.html" class="btn">← 返回</a></div>
</div>
<div class="f">
  <input type="file" id="csvFile" accept=".csv" style="padding:5px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px">
  <button class="btn btn-sm btn-primary" onclick="importCsv()">📥 导入CSV</button>
  <select id="sceneFilter" onchange="loadDatasources()" class="fs"><option value="">全部</option><option>MySQL</option><option>API</option><option>CSV</option></select>
</div>

<div class="card"><div class="card-header">数据源列表 <span id="dsCount" style="font-size:11px;color:var(--muted)">0</span></div>
<div class="card-body np" style="padding:0">
<table><thead><tr><th>编码</th><th>名称</th><th>类型</th><th>主机</th><th>端口</th><th>同步频率</th><th>状态</th><th>最近连接</th><th>操作</th></tr></thead>
<tbody id="dsTable"></tbody></table></div></div>

<div class="card"><div class="card-header">CSV导入历史</div><div class="card-body"><div id="syncLogs" style="font-size:12px;color:var(--muted)">暂无导入记录</div></div></div>

<div class="modal" id="dsModal"><div class="modal-box">
  <h3 id="modalTitle">新增数据源</h3>
  <div class="form-group"><label>编码</label><input id="f_code" placeholder="如 FW_MOM_MYSQL"></div>
  <div class="form-group"><label>名称</label><input id="f_name" placeholder="如 生产系统MOM数据库"></div>
  <div class="form-group"><label>类型</label><select id="f_type"><option>MySQL</option><option>API</option><option>CSV</option><option>Redis</option></select></div>
  <div class="form-group" id="hostGroup"><label>主机地址</label><input id="f_host" placeholder="127.0.0.1"></div>
  <div class="form-group" id="portGroup"><label>端口</label><input id="f_port" type="number" value="3306"></div>
  <div class="form-group" id="dbGroup"><label>数据库名</label><input id="f_db" placeholder="xiyi_quality"></div>
  <div class="form-group"><label>同步频率</label><select id="f_sync"><option value="daily">每日</option><option value="hourly">每小时</option><option value="weekly">每周</option></select></div>
  <div class="form-group"><label>重试次数</label><input id="f_retry" type="number" value="3"></div>
  <div class="form-actions">
    <button class="btn" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveDatasource()">保存</button>
  </div>
</div></div>

<script>
const API = '/api/v1/xiyi';
var editId = null;

async function loadDatasources() {
  const r = await fetch(API + '/datasources').then(r=>r.json());
  if (r.code !== 0) return;
  const ds = r.data.datasources || [];
  document.getElementById('dsCount').textContent = '(' + ds.length + ')';
  const filter = document.getElementById('sceneFilter').value;
  const filtered = filter ? ds.filter(d => d.source_type === filter) : ds;
  document.getElementById('dsTable').innerHTML = filtered.map(d =>
    '<tr><td>' + d.source_code + '</td><td>' + d.source_name + '</td><td>' + d.source_type + '</td>' +
    '<td>' + (d.host||'-') + '</td><td>' + (d.port||'-') + '</td><td>' + (d.sync_frequency||'daily') + '</td>' +
    '<td><span class="sb ' + (d.status==='active'?'sb-on':d.status==='error'?'sb-off':'sb-warn') + '">' + (d.status||'inactive') + '</span></td>' +
    '<td style="font-size:10px">' + (d.last_connected||'-') + '</td>' +
    '<td><button class="btn btn-sm" onclick="testConn(' + d.id + ')">测试</button> <button class="btn btn-sm btn-primary" onclick="editDs(' + d.id + ')">编辑</button></td></tr>'
  ).join('');
}

async function testConn(id) {
  const r = await fetch(API + '/datasources/' + id + '/test', {method:'POST',headers:{'Content-Type':'application/json'}}).then(r=>r.json());
  alert(r.code===0 ? (r.data.connected ? '✅ 连接成功' : '❌ 失败: '+r.data.message) : '❌ '+r.error);
  loadDatasources();
}

function showModal(mode) {
  editId = null;
  document.getElementById('dsModal').classList.add('active');
  document.getElementById('modalTitle').textContent = mode === 'add' ? '新增数据源' : '编辑数据源';
  if (mode !== 'add') return;
  ['f_code','f_name','f_host','f_db'].forEach(id => document.getElementById(id).value='');
  document.getElementById('f_port').value='3306';
  document.getElementById('f_retry').value='3';
}
function closeModal() { document.getElementById('dsModal').classList.remove('active'); }

async function saveDatasource() {
  const body = {
    source_code: document.getElementById('f_code').value,
    source_name: document.getElementById('f_name').value,
    source_type: document.getElementById('f_type').value,
    host: document.getElementById('f_host').value,
    port: parseInt(document.getElementById('f_port').value) || 3306,
    db_name: document.getElementById('f_db').value,
    sync_frequency: document.getElementById('f_sync').value,
    retry_count: parseInt(document.getElementById('f_retry').value) || 3
  };
  const url = editId ? API + '/datasources/' + editId : API + '/datasources';
  const method = editId ? 'PUT' : 'POST';
  const r = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}).then(r=>r.json());
  if (r.code === 0) { closeModal(); loadDatasources(); }
  else alert('❌ ' + (r.error||'保存失败'));
}

async function editDs(id) {
  const r = await fetch(API + '/datasources/' + id).then(r=>r.json());
  if (r.code !== 0) return;
  const d = r.data.datasource;
  editId = id;
  document.getElementById('f_code').value = d.source_code || '';
  document.getElementById('f_name').value = d.source_name || '';
  document.getElementById('f_type').value = d.source_type || 'MySQL';
  document.getElementById('f_host').value = d.host || '';
  document.getElementById('f_port').value = d.port || 3306;
  document.getElementById('f_db').value = d.db_name || '';
  document.getElementById('f_sync').value = d.sync_frequency || 'daily';
  document.getElementById('f_retry').value = d.retry_count || 3;
  document.getElementById('modalTitle').textContent = '编辑数据源 - ' + d.source_name;
  document.getElementById('dsModal').classList.add('active');
}

async function importCsv() {
  const file = document.getElementById('csvFile').files[0];
  if (!file) { alert('请选择CSV文件'); return; }
  const fd = new FormData();
  fd.append('file', file);
  fd.append('scene_id', '1');
  const r = await fetch(API + '/csv-import', {method:'POST', body:fd}).then(r=>r.json());
  alert(r.code===0 ? '✅ ' + r.data.message : '❌ ' + (r.error||'导入失败'));
  loadSyncLogs();
}

async function loadSyncLogs() {
  document.getElementById('syncLogs').innerHTML = 'CSV导入记录将在此显示';
}
loadDatasources();
loadSyncLogs();
</script>
</body>
</html>
