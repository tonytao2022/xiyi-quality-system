<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预警管理 · 兮易AI大脑</title>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--card:#161d2a;--border:#1e2d4a;--text:#e2e8f0;--text2:#94a3b8;--muted:#64748b;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px 24px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;text-decoration:none;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .2s}
.btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,0.06)}
.btn-primary{background:var(--blue);color:#fff;border:none}.btn-sm{font-size:11px;padding:3px 10px}
.btn-danger{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
.card-header{padding:10px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card-body{padding:12px 14px}.np{padding:0}
.f{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.fs{padding:4px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px}
.sb{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
.sd{background:rgba(239,68,68,0.12);color:var(--red)}.sw{background:rgba(245,158,11,0.12);color:var(--yellow)}.si{background:rgba(59,130,246,0.12);color:var(--blue)}.sc{background:rgba(34,197,94,0.12);color:var(--green)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:6px 8px;border-bottom:2px solid var(--border);color:var(--muted);text-align:left;font-size:10px;font-weight:600}
td{padding:5px 8px;border-bottom:1px solid rgba(30,45,74,0.2);color:var(--text2)}
tr:hover td{background:rgba(59,130,246,0.03)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.alert-card{padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--border);border-radius:0 8px 8px 0;background:var(--bg2)}.alert-card.danger{border-color:var(--red)}.alert-card.warning{border-color:var(--yellow)}.alert-card.info{border-color:var(--blue)}.alert-card .at{font-size:13px;font-weight:600;margin-bottom:2px}.alert-card .ac{font-size:11px;color:var(--text2);margin-bottom:2px}.alert-card .am{font-size:10px;color:var(--muted)}
@media(max-width:768px){body{padding:12px}}
</style>
</head>
<body>
<div class="header"><div><h1>🔔 实时动态与预警管理</h1><div style="font-size:12px;color:var(--text2);margin-top:2px">共 <span id="totalCount">0</span> 条预警 · <span id="unreadCount" style="color:var(--red)">0</span> 条未处理</div></div><div><a href="/xiyi-quality-workbench.html" class="btn">← 返回工作台</a></div></div>
<div class="f">
<select id="statusFilter" onchange="loadAlerts()" class="fs"><option value="">全部状态</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="resolved">已解决</option><option value="dismissed">已忽略</option></select>
<select id="levelFilter" onchange="loadAlerts()" class="fs"><option value="">全部等级</option><option value="danger">🔴 危险</option><option value="warning">🟡 警告</option><option value="info">🔵 信息</option></select>
<button class="btn btn-sm btn-primary" onclick="loadAlerts()">🔄 刷新</button>
</div>
<div id="alertList"><div style="padding:40px;text-align:center;color:var(--muted)">加载中...</div></div>
<script>
async function loadAlerts() {
  var status = document.getElementById('statusFilter').value;
  var level = document.getElementById('levelFilter').value;
  var params = '?limit=50';
  if (status) params += '&status=' + status;
  try {
    var r = await fetch('/api/v1/xiyi/alerts' + params).then(r=>r.json());
    if (r.code === 0) {
      var alerts = r.data.alerts || [];
      var unread = r.data.unread_count || 0;
      document.getElementById('totalCount').textContent = alerts.length;
      document.getElementById('unreadCount').textContent = unread;
      if (alerts.length === 0) {
        document.getElementById('alertList').innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">暂无预警</div>';
        return;
      }
      var html = alerts.map(function(a){
        var icon = a.alert_level === 'danger' ? '🔴' : a.alert_level === 'warning' ? '🟡' : '🔵';
        var cls = a.alert_level === 'danger' ? 'danger' : a.alert_level === 'warning' ? 'warning' : 'info';
        var statusText = a.status === 'pending' ? '<span class="sb sd">待处理</span>' : a.status === 'processing' ? '<span class="sb sw">处理中</span>' : a.status === 'resolved' ? '<span class="sb sc">已解决</span>' : '<span class="sb si">已忽略</span>';
        return '<div class="alert-card ' + cls + '"><div class="at" style="color:' + (a.alert_level==='danger'?'var(--red)':a.alert_level==='warning'?'var(--yellow)':'var(--blue)') + '">' + icon + ' ' + a.alert_title + '</div><div class="ac">' + (a.alert_content||'') + '</div><div class="am" style="display:flex;justify-content:space-between"><span>' + a.created_at + '</span><span>' + (a.related_kpi ? '关联:'+a.related_kpi : '') + '</span><span>' + statusText + '</span></div></div>';
      }).join('');
      document.getElementById('alertList').innerHTML = html;
    }
  } catch(e) {
    document.getElementById('alertList').innerHTML = '<div style="color:var(--red);padding:20px">加载失败: ' + e.message + '</div>';
  }
}
loadAlerts();
</script>
</body>
</html>
