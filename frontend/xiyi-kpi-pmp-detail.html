<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMP指标详情 · 兮易AI大脑</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--card:#161d2a;--border:#1e2d4a;--text:#e2e8f0;--text2:#94a3b8;--muted:#64748b;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding:20px 24px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;text-decoration:none;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .2s}
.btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(59,130,246,0.06)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card-body{padding:14px 16px}.np{padding:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;transition:border-color .2s}
.st:hover{border-color:var(--blue)}.st .l{font-size:11px;color:var(--muted);margin-bottom:6px}
.st .v{font-size:26px;font-weight:700;letter-spacing:-0.5px}
.st .t{font-size:11px;color:var(--muted);margin-top:4px;padding-top:4px;border-top:1px solid rgba(30,45,74,0.3)}
.cht{width:100%;height:320px;padding:4px 0}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:6px 10px;border-bottom:2px solid var(--border);color:var(--muted);text-align:left;font-size:10px;font-weight:600}
td{padding:6px 10px;border-bottom:1px solid rgba(30,45,74,0.2);color:var(--text2)}
tr:hover td{background:rgba(59,130,246,0.03)}
.alert-bar{background:linear-gradient(135deg,rgba(239,68,68,0.06),rgba(239,68,68,0.01));border:1px solid rgba(239,68,68,0.2);border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.alert-bar .icon{font-size:20px}.alert-bar p{font-size:12px;color:var(--text2);line-height:1.5}
@media(max-width:768px){.stats,.g2{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>
<body>
<div class="header">
  <div><h1>⚙️ 过程FPY均值 (PMP) - 详情</h1><div style="font-size:13px;color:var(--text2);margin-top:4px">品质专员 · 制造过程磁物合格率监控</div></div>
  <div><a href="/xiyi-quality-workbench.html" class="btn">← 返回工作台</a></div>
</div>

<div id="content"></div>

<script>
var H = '';

H += '<div class="alert-bar"><div class="icon">⚠️</div><p><b>AI预警：</b>烧结工序FPY 95.2%低于98%目标，2#烧结炉温控系统老化导致温度波动，建议优先处理。</p></div>';

H += '<div class="stats">' +
  '<div class="st"><div class="l">本周过程FPY均值</div><div class="v" style="color:var(--yellow)">96.8%</div><div class="t">▼ 0.6% vs 上周 (目标≥97%)</div></div>' +
  '<div class="st"><div class="l">不合格工序数</div><div class="v" style="color:var(--red)">4个</div><div class="t">烧结/混合/包装/检测</div></div>' +
  '<div class="st"><div class="l">设备原因占比</div><div class="v" style="color:var(--red)">55%</div><div class="t">▲ 8% vs 上月</div></div>' +
'</div>';

// 趋势
H += '<div class="card"><div class="card-header">过程FPY趋势 (近12周)<span style="font-size:11px;color:var(--muted)">呈下降趋势</span></div><div class="card-body"><div class="cht"><canvas id="trendChart"></canvas></div></div></div>';

// 工序对比+不合格分布
H += '<div class="g2"><div class="card"><div class="card-header">各工序FPY对比 (本月)</div><div class="card-body"><div class="cht"><canvas id="processChart"></canvas></div></div></div>';
H += '<div class="card"><div class="card-header">不合格原因结构分析</div><div class="card-body"><div class="cht"><canvas id="defectChart"></canvas></div></div></div></div>';

// 明细
H += '<div class="card"><div class="card-header">不合格批次明细</div><div class="card-body np"><table><thead><tr><th>批次号</th><th>工序</th><th>FPY值</th><th>标准</th><th>偏差</th><th>判定</th></tr></thead><tbody>' +
  '<tr style="background:rgba(239,68,68,0.04)"><td>P-NCM-W42-005</td><td>烧结</td><td style="color:var(--red)">95.2%</td><td>≥98%</td><td>-2.8%</td><td><span style="color:var(--red);font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(239,68,68,0.12)">不合格</span></td></tr>' +
  '<tr style="background:rgba(245,158,11,0.04)"><td>P-NCM-W42-004</td><td>混合</td><td style="color:var(--yellow)">96.5%</td><td>≥98%</td><td>-1.5%</td><td><span style="color:var(--yellow);font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(245,158,11,0.12)">不合格</span></td></tr>' +
  '<tr><td>P-NCM-W42-003</td><td>包装</td><td>98.2%</td><td>≥98%</td><td>+0.2%</td><td><span style="color:var(--green);font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(34,197,94,0.12)">合格</span></td></tr>' +
'</tbody></table></div></div>';

// 分解维度
H += '<div class="card"><div class="card-header">关联分解维度与数据来源</div><div class="card-body"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">' +
  '<div style="padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px"><div style="font-size:10px;color:var(--muted);margin-bottom:2px">分解维度</div>工序/设备/物料批次/时间周期</div>' +
  '<div style="padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px"><div style="font-size:10px;color:var(--muted);margin-bottom:2px">数据来源</div>MOM/MES/LIMS/SCADA</div>' +
  '<div style="padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px"><div style="font-size:10px;color:var(--muted);margin-bottom:2px">负责人</div>品质技术经理/设备工程师</div>' +
  '<div style="padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px"><div style="font-size:10px;color:var(--muted);margin-bottom:2px">更新频率</div>每日(产线实时)</div>' +
'</div></div></div>';

document.getElementById('content').innerHTML = H;

setTimeout(function(){
  // 趋势
  var ctx = document.getElementById('trendChart');
  if (ctx) {
    new Chart(ctx, {
      type: 'line', data: {
        labels: ['W31','W32','W33','W34','W35','W36','W37','W38','W39','W40','W41','W42'],
        datasets: [{
          label: '过程FPY(%)',
          data: [98.2,98.5,98.0,97.5,97.2,97.8,98.0,97.5,97.0,96.5,96.8,97.0],
          borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)',
          tension: 0.4, fill: true, pointRadius: 3
        },{
          label: '目标 97%',
          data: Array(12).fill(97),
          borderColor: '#22c55e', borderWidth: 2, borderDash: [5,5], pointRadius: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top', labels: { color: '#94a3b8', boxWidth: 10 } } },
        scales: { y: { min: 95, max: 99.5, grid: { color: 'rgba(30,45,74,0.3)' } }, x: { grid: { display: false } } }
      }
    });
  }

  // 工序对比
  var ctx2 = document.getElementById('processChart');
  if (ctx2) {
    new Chart(ctx2, {
      type: 'bar', data: {
        labels: ['烧结','混合','包装','检测','粉碎'],
        datasets: [{
          label: 'FPY(%)', data: [95.2,96.5,98.2,99.0,98.5],
          backgroundColor: ['#ef4444','#f59e0b','#3b82f6','#22c55e','#22c55e']
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { min: 93, max: 100, grid: { color: 'rgba(30,45,74,0.3)' } }, x: { grid: { display: false } } }
      }
    });
  }

  // 不合格结构
  var ctx3 = document.getElementById('defectChart');
  if (ctx3) {
    new Chart(ctx3, {
      type: 'bar', data: {
        labels: ['烧结温度异常','混合不均','包装污染','检测误差','设备振动','其他'],
        datasets: [{
          data: [35,22,18,15,7,3],
          backgroundColor: ['#ef4444','#ef4444','#f59e0b','#f59e0b','#22c55e','#64748b']
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, grid: { color: 'rgba(30,45,74,0.3)' } }, x: { grid: { display: false } } }
      }
    });
  }
}, 100);
</script>
</body>
</html>
