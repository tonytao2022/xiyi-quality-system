<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSW成本总览 · 扁钢线 · 兮易AI智体</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--bg:#0a0e17;--bg2:#111827;--card:#161d2a;--card-hover:#1c2538;--border:#1e2d4a;--text:#e2e8f0;--text2:#94a3b8;--muted:#64748b;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:210px;min-width:210px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;z-index:100;overflow-y:auto}
.sidebar-logo{padding:18px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo .title{font-size:14px;font-weight:700;color:#fff}
.sidebar-logo .sub{font-size:11px;color:var(--muted);margin-top:2px}
.sidebar-nav{padding:10px 0}
.nav-item{display:flex;align-items:center;padding:10px 16px;color:var(--text2);font-size:13px;cursor:pointer;transition:all .2s;border-left:3px solid transparent;text-decoration:none}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,0.1);color:var(--blue);border-left-color:var(--blue)}
.nav-item .icon{margin-right:8px;width:18px;text-align:center}
.nav-section{padding:8px 16px 4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.main-content{flex:1;margin-left:210px;padding:20px 24px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:18px;font-weight:700;color:#fff}
.topbar .info{font-size:12px;color:var(--text2)}
.header-badge{font-size:11px;padding:3px 10px;border-radius:10px;background:rgba(59,130,246,0.1);color:var(--blue);border:1px solid rgba(59,130,246,0.2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card-body{padding:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi-card .label{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi-card .value{font-size:22px;font-weight:700}
.kpi-card .target{font-size:12px;color:var(--text2);margin-top:4px}
.kpi-card .gap{font-size:12px;margin-top:2px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.chart-full{grid-column:1/-1}
.ch{height:280px}
.chart-sm{height:200px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 10px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600;text-align:left}
td{padding:7px 10px;border-bottom:1px solid rgba(30,45,74,0.4);color:var(--text2)}
tr:hover td{background:rgba(59,130,246,0.03)}
.badge-severity{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500}
.sev-critical{background:rgba(239,68,68,0.15);color:var(--red)}
.sev-serious{background:rgba(239,68,68,0.1);color:#f87171}
.sev-medium{background:rgba(245,158,11,0.12);color:var(--yellow)}
.sev-mild{background:rgba(59,130,246,0.1);color:var(--blue)}
.text-ok{color:var(--green)}
.text-warn{color:var(--yellow)}
.text-danger{color:var(--red)}
.link{color:var(--blue);cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.loading{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:768px){.sidebar{display:none}.main-content{margin-left:0;padding:14px}.chart-row{grid-template-columns:1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="/xiyi-auth.js"></script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="title">🏭 FSW成本分析</div>
      <div class="sub">扁钢线 · 成本专员</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">成本分析</div>
      <a class="nav-item active" href="/xiyi-FSW_cost-overview.html"><span class="icon">📊</span>成本总览</a>
      <a class="nav-item" href="/xiyi-FSW_cost-anomaly.html"><span class="icon">⚠️</span>异常成本列表</a>
      <a class="nav-item" href="/xiyi-FSW_cost-trace.html"><span class="icon">🔍</span>单因追溯</a>
      <a class="nav-item" href="/xiyi-FSW_cost-multitrace.html"><span class="icon">🧩</span>多因归因</a>
      <div style="border-top:1px solid var(--border);margin:10px 16px;"></div>
      <div class="nav-section">其他</div>
      <a class="nav-item" href="/xiyi-quality-workbench.html"><span class="icon">🔙</span>返回平台首页</a>
    </nav>
  </aside>
  <div class="main-content">
    <div class="topbar">
      <div>
        <h1>📊 成本总览仪表盘</h1>
        <div class="info" id="timeInfo">加载中...</div>
      </div>
      <div><span class="header-badge">💰 扁钢线FSW · 成本分析</span></div>
    </div>

    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="chart-row">
      <div class="card">
        <div class="card-header">成本构成<span style="font-size:11px;color:var(--muted);font-weight:400">(万元)</span></div>
        <div class="card-body"><div class="ch" id="pieChart"></div></div>
      </div>
      <div class="card">
        <div class="card-header">周成本趋势<span style="font-size:11px;color:var(--muted);font-weight:400">实际 vs 预算</span></div>
        <div class="card-body"><div class="ch" id="trendChart"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">🔴 异常成本TOP<span style="font-size:11px;color:var(--muted);font-weight:400">(点击可追溯分析)</span></div>
      <div class="card-body"><table><thead><tr><th>#</th><th>异常因子</th><th>成本影响(万元)</th><th>触发规则</th><th>发现日期</th><th>操作</th></tr></thead><tbody id="topAnomalyTable"></tbody></table></div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1/FSW_cost';

async function init() {
  try {
    const r = await authFetch(API+'/overview').then(r=>r.json());
    if (r.code !== 0) { showError(r.error); return; }
    renderDashboard(r.data);
  } catch(e) { showError(e.message); }
}

function tab(s) { return s || '-' }

function renderDashboard(d) {
  document.getElementById('timeInfo').textContent = '数据基于本月实际成本 · 月累 ' + tab(d.total_cost_monthly) + '万元 / 预算 ' + tab(d.budget) + '万元';

  // KPI
  const kpiGrid = document.getElementById('kpiGrid');
  const kpiMap = {};
  (d.kpi_summary || []).forEach(k => {
    const lvl = k.level === 'danger' ? 'text-danger' : k.level === 'warning' ? 'text-warn' : 'text-ok';
    kpiGrid.innerHTML += '<div class="kpi-card"><div class="label">' + tab(k.label) + '</div><div class="value" style="font-size:20px">' + tab(k.value) + '</div><div class="target">目标: ' + tab(k.target) + '</div><div class="gap ' + lvl + '">' + tab(k.gap) + '</div></div>';
  });

  // 饼图
  const pieEl = document.getElementById('pieChart');
  if (d.cost_breakdown && d.cost_breakdown.length) {
    const colors = ['#ef4444','#f59e0b','#3b82f6','#22c55e','#8b5cf6','#64748b'];
    const data = d.cost_breakdown.map((c,i) => ({
      name: c.name + ' (' + c.pct + '%)',
      value: c.value,
      itemStyle: { color: colors[i % colors.length] }
    }));
    echarts.init(pieEl).setOption({
      tooltip: { trigger: 'item', formatter: '{b}: {c}万元 ({d}%)' },
      legend: { bottom: 0, textStyle: { color: '#94a3b8', fontSize: 11 }, itemWidth: 10 },
      series: [{
        type: 'pie', radius: ['35%', '65%'], center: ['50%', '45%'],
        label: { show: false },
        data: data
      }]
    });
  }

  // 趋势图
  const trendEl = document.getElementById('trendChart');
  if (d.cost_trend) {
    const ct = d.cost_trend;
    echarts.init(trendEl).setOption({
      tooltip: { trigger: 'axis' },
      legend: { data: ['实际成本','预算线'], textStyle: { color: '#94a3b8', fontSize: 11 }, itemWidth: 10 },
      grid: { top: 30, bottom: 20, left: 45, right: 10 },
      xAxis: { type: 'category', data: ct.labels, axisLabel: { color: '#64748b', fontSize: 10 } },
      yAxis: { type: 'value', name: '万元', nameTextStyle: { color: '#64748b', fontSize: 10 }, axisLabel: { color: '#64748b' }, splitLine: { lineStyle: { color: 'rgba(30,45,74,0.4)' } } },
      series: [
        { name: '实际成本', type: 'line', data: ct.actual, smooth: true, lineStyle: { color: '#ef4444', width: 2 }, symbol: 'circle', symbolSize: 6, areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(239,68,68,0.2)' }, { offset: 1, color: 'rgba(239,68,68,0)' }] } } },
        { name: '预算线', type: 'line', data: ct.budget, lineStyle: { color: '#22c55e', width: 2, type: 'dashed' }, symbol: 'none' }
      ]
    });
  }

  // 异常TOP
  const tbody = document.getElementById('topAnomalyTable');
  if (d.top_anomalies && d.top_anomalies.length) {
    d.top_anomalies.forEach((a,i) => {
      tbody.innerHTML += '<tr><td>' + (i+1) + '</td><td><strong>' + tab(a.factor) + '</strong></td><td style="color:var(--red);font-weight:600">' + tab(a.cost_impact) + '</td><td><span class="badge-severity sev-serious" style="font-size:10px">' + tab(a.trigger) + '</span></td><td>' + tab(a.date) + '</td><td><a class="link" href="/xiyi-FSW_cost-trace.html?id=' + a.id + '">🔍追溯分析</a></td></tr>';
    });
  }
}

function showError(msg) {
  document.querySelector('.main-content').innerHTML = '<div class="loading">⚠️ 加载失败: ' + (msg || '未知错误') + '</div>';
}

init();
window.addEventListener('resize', () => {
  document.querySelectorAll('.ch').forEach(el => { const i = echarts.getInstanceByDom(el); if(i) i.resize(); });
});
</script>
</body>
</html>
